[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bio-mcp"
version = "0.1.0"
description = "Local-only MCP tools for lightweight bioinformatics sequence analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "bio-mcp contributors" }
]
dependencies = [
  "mcp>=1.9.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "biopython>=1.83",
]

[project.scripts]
bio-mcp = "bio_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bio_mcp", "src/binder_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
